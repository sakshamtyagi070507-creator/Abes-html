<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>
<body>
    <h1>Hotel Management</h1>
    <!-- perosnal information -->
    <label for="name"> Full Name: </label>
    <input type="text" name="name" id="name" required placeholder="e.g. arjun">
    <br><br>
    <label for="email">Email: </label>
    <input type="email" id="email" name="email" required placeholder="e.g. abe@abes.com">
    <br><br>
     <label for="phone">Phone: </label>
    <input type="number" id="phone" name="phone" required placeholder="e.g. 289764932">

    <br><br>
    <label for="password">password: </label>
    <input type="password" id="password" name="password" required>
    <br><br>
    <label for="date">Date: </label>
    <input type="date" id="date" name="date" required>
    <br><br>
    <label for="date">Check-out date: </label>
    <input type="date" id="Check-out" name="Check-out" required>
    <br><br>
     <label for="Guest">Number of Guest: </label>
    <input type="number" id="Guest" name="Guest" min="10" max="20" required>
    <br><br>



</body>
</html>
